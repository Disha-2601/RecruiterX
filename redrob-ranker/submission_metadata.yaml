methodology_summary: |
  Our solution leverages offline precomputation to build robust and efficient candidate index matrices. We extract flat features into a Parquet table and use SentenceTransformer (all-MiniLM-L6-v2) to embed skill lists (100K) and career history entries (300K roles) offline using a multi-process CPU pool. During evaluation, rank.py loads the precomputed files and executes in under 30 seconds using vectorized numpy matrix operations to perform embedding similarity, trapezoidal experience fit, reachability/availability scoring, and consistency/honeypot checks. Human-readable deterministic reasoning is generated at the end to guarantee absolute alignment between scores and explanations.

